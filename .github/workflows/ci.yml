# Continuous integration for @betanyc/nyc-record-mcp.
#
# Enforces that the TypeScript still compiles and the test suite passes on a
# clean, locked install across the ends of the supported Node range.
#
# There is deliberately no separate build step: `npm test` is
# `npm run build && node --test "test/*.test.mjs"`, so it compiles first and a
# standalone `npm run build` step would only run tsc a second time. A compile
# error still fails the job, with tsc's output at the top of the test step's log.
#
# The tests are offline — every one of them mocks `globalThis.fetch`, so no
# Socrata API key and no network access are required in CI.
#
# Node matrix: 20.x and 22.x. package.json declares `engines.node ">=18"`, and
# the matrix stays within that floor while using only actively-maintained LTS
# releases. Node 18 reached End-of-Life on 2025-04-30 and is excluded on
# purpose. This mirrors the convention already established in the sibling
# nyc-charter-laws-rules repo, keeping CI consistent across BetaNYC's MCP repos.
# If the engines floor is raised to ">=20" later, drop this note.
#
# Owned by the software-engineer agent per BetaNYC engineering standards.

name: CI

on:
  # `test/**` matters: the tests are `.mjs`, so `**/*.ts` does not match them and
  # a test-only change would otherwise skip this gate entirely — silently, which
  # is the failure mode this workflow exists to prevent.
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  # Manual trigger — lets us fire a run on any branch. Needed because a
  # path-scoped pull_request/push event does not fire on the very PR that
  # introduces the workflow, so this gate never executed on its own PR (#3).
  # Adding `.github/workflows/**` to the path filters above closes that gap for
  # future workflow edits; this dispatch is retained permanently as a low-cost
  # affordance for on-demand re-runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
