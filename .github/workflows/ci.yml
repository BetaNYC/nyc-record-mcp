# Continuous integration for @betanyc/nyc-record-mcp.
#
# Enforces that the TypeScript still compiles and the test suite passes on a
# clean, locked install across the ends of the supported Node range.
#
# There is deliberately no separate build step: `npm test` is
# `npm run build && node --test test/*.test.mjs`, so it compiles first and a
# standalone `npm run build` step would only run tsc a second time. A compile
# error still fails the job, with tsc's output at the top of the test step's log.
#
# That glob is deliberately UNQUOTED so the shell expands it and node receives
# literal file paths. Quoting it makes node do the matching, and node's own
# handling differs by version: Node 20 does not accept glob patterns at all
# (added in 22) and fails with "Could not find 'test/*.test.mjs'", while a bare
# directory argument stopped working in later versions. Shell expansion is the
# one form that works across the whole supported range. Do not re-add the quotes.
#
# The tests are offline — every one of them mocks `globalThis.fetch`, so no
# Socrata API key and no network access are required in CI.
#
# Node matrix: 20.x and 22.x. package.json declares `engines.node ">=18"`, and
# the matrix stays within that floor while using only actively-maintained LTS
# releases. Node 18 reached End-of-Life on 2025-04-30 and is excluded on
# purpose. This mirrors the convention already established in the sibling
# nyc-charter-laws-rules repo, keeping CI consistent across BetaNYC's MCP repos.
# If the engines floor is raised to ">=20" later, drop this note.
#
# Owned by the software-engineer agent per BetaNYC engineering standards.

name: CI

on:
  # `test/**` matters: the tests are `.mjs`, so `**/*.ts` does not match them and
  # a test-only change would otherwise skip this gate entirely — silently, which
  # is the failure mode this workflow exists to prevent.
  pull_request:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "WHATS-CHANGED.md"
      - "CHANGELOG.md"
      - "DATA-SOURCES.json"
      - "data.json"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "**/*.ts"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "WHATS-CHANGED.md"
      - "CHANGELOG.md"
      - "DATA-SOURCES.json"
      - "data.json"
      - "scripts/**"
  # Manual trigger — lets us fire a run on any branch. Needed because a
  # path-scoped pull_request/push event does not fire on the very PR that
  # introduces the workflow, so this gate never executed on its own PR (#3).
  # Adding `.github/workflows/**` to the path filters above closes that gap for
  # future workflow edits; this dispatch is retained permanently as a low-cost
  # affordance for on-demand re-runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20.x"
          - "22.x"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  # The about-data standard (betanyc-ai-workspace platform/system/about-data-standard.md § 7).
  # scripts/whats_changed.py, scripts/tests/catalog_validate.py, scripts/mcp_shared/ and
  # src/betanyc-tools.ts are copies of the workspace's canonical files: never edit them here.
  # 1. DATA-SOURCES.json is valid and every tool the built server lists (TOOLS, the list the
  #    ListTools handler returns) has a source.
  # 2. data.json (DCAT-US 3.0) matches DATA-SOURCES.json; rebuild with the same command
  #    without --check. 3. DATA-SOURCES.json against its JSON Schema and data.json against the
  #    vendored DCAT-US 3.0 schema, with pinned validators (CI only, not runtime dependencies).
  # The release gate (`about-data check --release`, which also refuses the placeholder contact)
  # runs in release.yml before `npm publish`. It is not run here.
  about-data:
    name: About data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: npm ci && npm run build

      - name: The server's tool list
        run: >-
          node --input-type=module -e 'const t = await import("./dist/tools.js"); console.log(JSON.stringify(t.TOOLS.map((x) => x.name)));' > "$RUNNER_TEMP/tools.json"

      - name: DATA-SOURCES.json is valid and explains every tool
        run: python3 scripts/whats_changed.py about-data check DATA-SOURCES.json --tools-file "$RUNNER_TEMP/tools.json"

      - name: data.json is current
        run: python3 scripts/whats_changed.py about-data catalog DATA-SOURCES.json --check

      - name: Validate against the JSON Schema and DCAT-US 3.0
        run: |
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py data-sources DATA-SOURCES.json
          uv run --no-project --with jsonschema==4.26.0 --with referencing==0.37.0 --with rfc3987==1.3.8 \
            python scripts/tests/catalog_validate.py dcat data.json

  # The What's changed standard (betanyc-ai-workspace
  # platform/system/whats-changed-standard.md § 10). scripts/whats_changed.py is a copy of the
  # workspace's canonical file: never edit it here. `check --base-ref` needs the base branch's
  # history (fetch-depth: 0): old entries are append-only, and a package.json version bump
  # needs an MCP entry naming the new version. This repo has no site, so there is no page to
  # rebuild: GitHub's rendering of WHATS-CHANGED.md is the page. Stdlib only, so no pip install.
  whats-changed:
    name: What's changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check WHATS-CHANGED.md
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --base-ref "origin/${{ github.base_ref || 'main' }}"
