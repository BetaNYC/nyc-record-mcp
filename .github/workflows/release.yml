# Release automation for @betanyc/nyc-record-mcp.
#
# Trigger: pushing a tag matching `v*` (e.g. `v1.0.2`). The workflow verifies
# the tag matches the version in package.json, runs the test suite, publishes
# to npm with provenance, and creates a GitHub Release with auto-generated
# notes.
#
# Prerequisite: an `NPM_TOKEN` repository secret (npm automation token with
# publish rights on @betanyc/nyc-record-mcp). Provenance requires the
# id-token: write permission and publishing from GitHub Actions.
#
# Release procedure: bump `version` in package.json (+ lockfile) and in
# server.json (top-level and package entry) on main,
# then `git tag vX.Y.Z && git push origin vX.Y.Z`. Nothing publishes without
# a tag push.
#
# Before tagging: one commit dates the WHATS-CHANGED.md "## Unreleased:" entry and the
# CHANGELOG.md heading with the same New York date, and adds the dated anchor to the entry's MCP
# version link. Tag that commit. Full steps: README, "Releases". The "WHATS-CHANGED.md has no
# Unreleased entry" step below enforces the dating.
#
# Owned by the software-engineer agent per BetaNYC engineering standards.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test --if-present

      - name: Verify server.json versions match package.json
        run: |
          node -e '
            const p = require("./package.json"), s = require("./server.json");
            const bad = [s.version, ...s.packages.map((x) => x.version)].filter((v) => v !== p.version);
            if (bad.length || s.name !== p.mcpName) { console.error("server.json is out of step with package.json"); process.exit(1); }
          '

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${PKG_VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      # WHATS-CHANGED.md: the version bump's entry is "## Unreleased: Title" until the release
      # commit dates it ("## YYYY-MM-DD: Title", same title). This fails while one is left.
      # scripts/whats_changed.py is a copy of the workspace's canonical file; never edit it.
      - name: WHATS-CHANGED.md has no Unreleased entry
        run: python3 scripts/whats_changed.py check WHATS-CHANGED.md --release

      # The about-data release gate (about-data-standard.md § 7): fails on any error in
      # DATA-SOURCES.json, a tool the built server lists without a source, or the placeholder
      # contact address. `npm test` above already built dist/.
      - name: "DATA-SOURCES.json is valid and names a real contact"
        run: |
          node --input-type=module -e 'const t = await import("./dist/tools.js"); console.log(JSON.stringify(t.TOOLS.map((x) => x.name)));' > "$RUNNER_TEMP/tools.json"
          python3 scripts/whats_changed.py about-data check DATA-SOURCES.json --release --tools-file "$RUNNER_TEMP/tools.json"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
